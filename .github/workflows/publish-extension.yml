name: Publish Extension

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Read version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Verify tag matches package.json version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="${{ steps.version.outputs.version }}"
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag v${TAG} does not match package.json version ${PKG}"
            exit 1
          fi

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Package VSIX
        run: npm run package

      - name: Publish to Visual Studio Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: >
          npx vsce publish
          --packagePath "pegasi-classroom-install-${{ steps.version.outputs.version }}.vsix"
          --readme-path EXTENSION_README.md
          -p "$VSCE_PAT"

      - name: Create GitHub Release with VSIX
        uses: softprops/action-gh-release@v2
        with:
          files: pegasi-classroom-install-*.vsix
          generate_release_notes: true
